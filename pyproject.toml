[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asteria-retention-signals"
version = "0.1.0"
description = "A reproducible workforce-retention analytics product."
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<2.4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
asteria_retention = ["sql/*.sql"]
